<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album Downloader</title>
<style>
  :root {
    --ink: #0f0f12;
    --muted: #8b8d94;
    --field: #f1f2f4;
    --row: #f6f7f9;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #e9eaee;
  }

  /* Kolom mobile; di desktop tampil sebagai kolom di tengah */
  .page {
    position: relative;
    max-width: 430px;
    min-height: 100dvh;
    margin: 0 auto;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    justify-content: flex-end;
    padding: 18px 20px 0;
    position: relative;
    z-index: 30;
  }
  .burger {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 10px;
    cursor: pointer; color: var(--ink);
  }
  .burger:focus-visible { outline: 2px solid #6c5ce7; outline-offset: 2px; }
  .burger svg line { transition: transform .25s ease, opacity .2s ease; transform-origin: center; }
  .burger[aria-expanded="true"] .l1 { transform: translateY(6px) rotate(45deg); }
  .burger[aria-expanded="true"] .l2 { opacity: 0; }
  .burger[aria-expanded="true"] .l3 { transform: translateY(-6px) rotate(-45deg); }

  /* ---------- Menu dropdown ---------- */
  .menu {
    position: absolute;
    top: 64px; right: 16px;
    width: 232px;
    padding: 10px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(20, 20, 40, .18), 0 2px 8px rgba(20, 20, 40, .06);
    display: flex; flex-direction: column; gap: 8px;
    opacity: 0; transform: translateY(-8px) scale(.96);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .menu.open { opacity: 1; transform: none; pointer-events: auto; }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 10px 12px 10px 10px;
    background: var(--row);
    border: 0; border-radius: 16px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    text-align: left; cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .menu-item:hover { background: #eceef2; }
  .menu-item:active { transform: scale(.98); }
  .menu-item:focus-visible { outline: 2px solid #6c5ce7; outline-offset: 1px; }
  .menu-item .ico {
    width: 38px; height: 38px; flex: none;
    display: grid; place-items: center;
    border-radius: 12px;
  }
  .menu-item .label { flex: 1; }
  .menu-item .chev { color: #a3a6ad; flex: none; }
  .ico.login   { background: #e3f6ee; color: #1c6b52; }
  .ico.premium { background: #e6ecfb; color: #2d4aa3; }
  .ico.logout  { background: #eceef1; color: #2b2d33; }

  /* ---------- Konten ---------- */
  .hero { padding: 0 24px; }
  .logo {
    text-align: center;
    font-size: 36px; font-weight: 400; letter-spacing: .02em;
    margin: 26px 0 28px;
  }
  .search {
    display: flex; align-items: center;
    background: var(--field);
    border-radius: 12px;
    padding: 0 6px 0 14px;
    height: 44px;
  }
  .search input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: 0;
    font: inherit; font-size: 13px; color: var(--ink);
  }
  .search input::placeholder { color: #6f7178; }
  .search button {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 10px;
    color: var(--ink); cursor: pointer;
  }
  .search:focus-within { box-shadow: 0 0 0 2px #6c5ce7 inset; }
  .headline {
    margin-top: 34px;
    font-size: 22px; font-weight: 800; line-height: 1.22;
    letter-spacing: -.01em;
    max-width: 14em;
  }

  /* ---------- Kolase cover bergerak ---------- */
  .stage {
    position: relative;
    flex: 1;
    min-height: 380px;
    margin-top: 18px;
    overflow: hidden;
  }
  .stage::before {           /* pudar halus di bawah heading */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 36px;
    background: linear-gradient(#fff, rgba(255,255,255,0));
    z-index: 5; pointer-events: none;
  }
  .cover {
    position: absolute;
    width: 32%;
    aspect-ratio: 1;
    border-radius: 3px;
    background:
      radial-gradient(circle at 68% 76%, rgba(255,255,255,.9) 0 7%, transparent 7.5%),
      radial-gradient(circle at 30% 30%, rgba(255,255,255,.18) 0 12%, transparent 13%),
      var(--g);
    box-shadow: 0 8px 16px rgba(30, 10, 50, .35);
    transform: rotate(var(--r));
    animation: drift var(--t) ease-in-out var(--d) infinite alternate;
    will-change: transform;
  }
  @keyframes drift {
    from { transform: translate(0, 0) rotate(var(--r)); }
    to   { transform: translate(var(--dx), var(--dy)) rotate(calc(var(--r) + var(--dr))); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cover { animation: none; }
    .menu, .burger svg line { transition: none; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <button class="burger" id="burger" aria-label="Buka menu" aria-expanded="false" aria-controls="menu">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <line class="l1" x1="3" y1="7"  x2="23" y2="7"/>
        <line class="l2" x1="3" y1="13" x2="23" y2="13"/>
        <line class="l3" x1="3" y1="19" x2="23" y2="19"/>
      </svg>
    </button>

    <nav class="menu" id="menu" aria-label="Menu akun">
      <button class="menu-item" data-action="login">
        <span class="ico login">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg>
        </span>
        <span class="label">Login</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="menu-item" data-action="premium">
        <span class="ico premium">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/><path d="M5.5 22h13"/></svg>
        </span>
        <span class="label">Premium</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="menu-item" data-action="logout">
        <span class="ico logout">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/></svg>
        </span>
        <span class="label">Logout</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </nav>
  </header>

  <main class="hero">
    <div class="logo">LOGO</div>

    <form class="search" id="searchForm" role="search">
      <input id="urlInput" type="url" inputmode="url" autocomplete="off"
             placeholder="https://spotify.com/......................................"
             aria-label="Link album Spotify">
      <button type="submit" aria-label="Cari">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
    </form>

    <h1 class="headline">download album favoritmu dalam satu klik</h1>
  </main>

  <section class="stage" id="stage" aria-hidden="true"></section>
</div>

<script>
/* ---------- Menu hamburger ---------- */
const burger = document.getElementById('burger');
const menu = document.getElementById('menu');

function setMenu(open) {
  menu.classList.toggle('open', open);
  burger.setAttribute('aria-expanded', open);
  burger.setAttribute('aria-label', open ? 'Tutup menu' : 'Buka menu');
}
burger.addEventListener('click', e => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); });
document.addEventListener('click', e => { if (!menu.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

menu.addEventListener('click', e => {
  const item = e.target.closest('[data-action]');
  if (!item) return;
  setMenu(false);
  // TODO: sambungkan ke halaman/aksi masing-masing
  console.log('Menu dipilih:', item.dataset.action);
});

/* ---------- Search (placeholder, belum tersambung ke backend) ---------- */
document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  console.log('URL:', document.getElementById('urlInput').value.trim());
});

/* ---------- Kolase cover bergerak ---------- */
const gradients = [
  'linear-gradient(160deg,#5b2a86 0%,#b2498f 55%,#f59e5b 100%)',
  'linear-gradient(160deg,#2b1b5e 0%,#8b3fa8 50%,#ff7a59 100%)',
  'linear-gradient(160deg,#432371 0%,#fa709a 60%,#fee140 100%)',
  'linear-gradient(160deg,#1e3c72 0%,#6a5acd 55%,#ff9a8b 100%)',
  'linear-gradient(160deg,#4b1d52 0%,#c0392b 60%,#f6d365 100%)'
];

// pseudo-random dengan seed tetap supaya tata letak konsisten
let seed = 11;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const between = (a, b) => a + rand() * (b - a);

const stage = document.getElementById('stage');
const cols = 3, rows = 5;

for (let i = 0; i < cols * rows; i++) {
  const col = i % cols, row = Math.floor(i / cols);
  const el = document.createElement('div');
  el.className = 'cover';
  el.style.left = (col * 33 - 3 + (row % 2 ? 5 : 0) + between(-2, 3)) + '%';
  el.style.top  = (row * 21 - 2 + between(-2, 3)) + '%';
  el.style.setProperty('--g',  gradients[i % gradients.length]);
  el.style.setProperty('--r',  between(-14, 14).toFixed(1) + 'deg');
  el.style.setProperty('--dr', between(-8, 8).toFixed(1) + 'deg');
  el.style.setProperty('--dx', between(-14, 14).toFixed(0) + 'px');
  el.style.setProperty('--dy', between(-22, 22).toFixed(0) + 'px');
  el.style.setProperty('--t',  between(5, 9).toFixed(1) + 's');
  el.style.setProperty('--d',  '-' + between(0, 6).toFixed(1) + 's');
  stage.appendChild(el);
}
</script>
</body>
</html>
