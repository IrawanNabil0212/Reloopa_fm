  }
  .wash-detail {                     /* kanan, dipakai di halaman album */
    right: 0; width: 60%; opacity: 0; transform: scaleX(-1);
    transition: opacity .9s ease;
    -webkit-mask-image: linear-gradient(270deg, #000 40%, transparent 100%);
            mask-image: linear-gradient(270deg, #000 40%, transparent 100%);
  }
  .wash-cover {                      /* warna mengikuti cover album */
    right: 0; width: 70%; opacity: 0; background-color: #cfc3d8;
    background-position: center; background-size: cover;
    filter: blur(46px) saturate(1.3); transform: scale(1.3);
    transition: opacity .9s ease;
    -webkit-mask-image: linear-gradient(270deg, #000 35%, transparent 100%);
            mask-image: linear-gradient(270deg, #000 35%, transparent 100%);
  }
  .page.show-detail .wash-detail { opacity: .55; }
  .page.show-detail.has-cover .wash-detail { opacity: 0; }
  .page.show-detail.has-cover .wash-cover { opacity: .6; }

  /* ---------- Header ---------- */
  .topbar {
    position: absolute; inset: 0 0 auto 0; z-index: 30; height: var(--header-h);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 20px; gap: 12px;
    transition: background .3s ease;
  }
  .page[data-state="detail"] .topbar { background: rgba(255, 255, 255, .6); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .brand { font-family: var(--display); font-weight: 500; font-size: 26px; letter-spacing: .01em; text-align: center; white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; font-family: var(--display); font-weight: 600; font-size: 15px; }
  .who .hi { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pill {
    flex: none; display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 10px; border-radius: 999px; border: 1px solid rgba(15, 15, 18, .35);
    font-family: var(--mono); font-size: 12px; font-weight: 500; line-height: 1.5; background: rgba(255, 255, 255, .55);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); cursor: default;
  }
  .pill[hidden] { display: none; }
  button.pill { cursor: pointer; }
  button.pill:hover { background: #fff; }
  .pill.is-premium { border-color: #e39a12; color: #8a5a00; }
  .qbadge { display: none; }
  .qbadge[hidden] { display: none; }
  .qbadge svg { flex: none; }
  .qbadge.is-empty { color: #d92d20; border-color: rgba(217, 45, 32, .5); }
  @media (min-width: 700px) { .qbadge:not([hidden]) { display: inline-flex; } }

  .burger {
    position: relative; z-index: 3; justify-self: end;
    width: 40px; height: 40px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 10px; cursor: pointer;
  }
  .burger:hover { background: rgba(255, 255, 255, .6); }
  .burger:focus-visible, .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .burger svg line { transition: transform .25s ease, opacity .2s ease; transform-origin: center; }
  .burger[aria-expanded="true"] .l1 { transform: translateY(6px) rotate(45deg); }
  .burger[aria-expanded="true"] .l2 { opacity: 0; }
  .burger[aria-expanded="true"] .l3 { transform: translateY(-6px) rotate(-45deg); }

  /* ---------- Menu ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 31; background: rgba(8, 8, 12, .6);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s .25s;
  }
  .scrim.open { opacity: 1; visibility: visible; transition: opacity .25s ease; }
  .menu {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 32;
    width: clamp(220px, 60vw, 300px); padding: 24px 12px 24px 14px;
    background: #fff; border-radius: 26px 0 0 26px; box-shadow: -12px 0 40px rgba(0, 0, 0, .18);
    display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
    transform: translateX(100%); visibility: hidden;
    transition: transform .28s var(--ease-out), visibility 0s .28s;
  }
  .menu.open { transform: none; visibility: visible; transition: transform .28s var(--ease-out); }
  .menu-title { font-size: 20px; font-weight: 500; line-height: 28px; padding-left: 8px; margin-bottom: 14px; }
  .menu-item {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 8px;
    background: none; border: 0; border-radius: 10px; font-size: 15px; font-weight: 500;
    text-align: left; cursor: pointer; transition: background .15s ease;
  }
  .menu-item[hidden] { display: none; }
  button.menu-item:hover { background: #f3f4f7; }
  button.menu-item:active { background: #eceef2; }
  .menu-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .menu-item.is-static { cursor: default; }
  .menu-item > svg { flex: none; }
  .menu-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-item .chev { color: var(--muted); }
  .menu-crown { color: #e39a12; }
  .menu-crown[hidden] { display: none; }

  /* =====================================================
     VIEW 1 - HERO
     ===================================================== */
  .view { position: absolute; inset: 0; z-index: 1; }
  .hero-view {
    display: flex; flex-direction: column; padding: calc(var(--header-h) + 10px) 22px 20px;
    will-change: transform;
  }
  .page.hero-gone .hero-view { visibility: hidden; }

  .hero-copy { position: relative; z-index: 2; flex: none; }
  .headline {
    font-family: var(--display); font-weight: 700; text-transform: lowercase;
    font-size: clamp(36px, 10.5vw, 52px); line-height: 1.04; letter-spacing: -.01em;
    max-width: 9.5em;
  }
  .search {
    margin-top: 26px; display: flex; align-items: center; gap: 10px;
    max-width: 520px; padding-bottom: 8px; border-bottom: 1.5px solid rgba(15, 15, 18, .85);
  }
  .search:focus-within { border-bottom-color: var(--accent); }
  .search input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0;
    font-family: var(--mono); font-size: 14px; color: var(--ink); padding: 6px 0;
  }
  .search input::placeholder { color: #55575e; }
  .search button {
    flex: none; width: 36px; height: 36px; display: grid; place-items: center;
    background: var(--ink); color: #fff; border: 0; border-radius: 4px; cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .search button:hover { background: #2a2a33; transform: translateY(-1px); }
  .search button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .search.shake { animation: shake .4s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .hint { margin-top: 12px; min-height: 22px; font-family: var(--mono); font-size: 12.5px; color: #3f4047; display: flex; align-items: center; gap: 8px; }
  .hint.err { color: #b3261e; }
  .hint.loading::before {
    content: ""; width: 14px; height: 14px; border-radius: 50%; flex: none;
    border: 2px solid rgba(15, 15, 18, .2); border-top-color: var(--ink); animation: spin .8s linear infinite;
  }
  .credit { position: absolute; z-index: 2; left: 22px; bottom: 18px; font-family: var(--mono); font-size: 11.5px; color: #3f4047; }

  /* ---------- Sampul + piringan (dipakai di rak, saat terbang, dan di halaman album) ---------- */
  .flyer .vinyl { position: absolute; z-index: 0; left: 4%; top: 4%; width: 92%; aspect-ratio: 1; border-radius: 50%; box-shadow: 0 8px 20px rgba(0, 0, 0, .35); }
  .flyer .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      conic-gradient(from 0deg, rgba(255,255,255,0) 0 8%, rgba(255,255,255,.16) 13%, rgba(255,255,255,0) 20% 58%, rgba(255,255,255,.13) 63%, rgba(255,255,255,0) 70%),
      repeating-radial-gradient(circle, #0c0c0e 0 2px, #1d1d21 3px 4px);
    will-change: transform;
  }
  .flyer .disc::before {
    content: ""; position: absolute; inset: 34%; border-radius: 50%;
    background: radial-gradient(circle at 50% 20%, #8a847e 0 7%, transparent 8%), linear-gradient(90deg, #d9d4cf 50%, #cbc5c0 50%);
    box-shadow: inset 0 0 0 6px #b9b3ae;
  }
  .flyer .disc::after { content: ""; position: absolute; inset: 47%; border-radius: 50%; background: #0c0c0e; }
  .flyer.spinning .disc { animation: spin 4.5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .flyer .sleeve {
    position: absolute; inset: 0; z-index: 1; overflow: hidden;
    background:
      radial-gradient(70% 70% at 15% 15%, rgba(255, 170, 205, .85), transparent 70%),
      radial-gradient(70% 70% at 90% 20%, rgba(150, 195, 255, .85), transparent 70%),
      radial-gradient(70% 70% at 60% 95%, rgba(255, 233, 150, .8), transparent 70%),
      #f3ecfa;
  }
  .flyer .sleeve img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease; }
  .flyer .sleeve img.ready { opacity: 1; }
  .flyer .sleeve::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.22), transparent 35%, rgba(0,0,0,.12)); pointer-events: none; }
  .flyer { will-change: transform; }
  .flyer.fixed { position: fixed; margin: 0; z-index: auto; }
  .flyer.fixed .sleeve { box-shadow: 0 14px 34px rgba(30, 10, 50, .4); }
  .fly-layer { position: fixed; inset: 0; z-index: 25; pointer-events: none; }

  /* =====================================================
     DESKTOP
     ===================================================== */
  @media (min-width: 900px) {
    :root { --header-h: 88px; }
    .topbar { padding: 0 48px; }
    .brand { font-size: 30px; }
    .who { font-size: 16px; }

    .hero-view { display: grid; grid-template-columns: 1fr 1fr; padding: var(--header-h) 0 0; }
    .hero-copy { align-self: center; padding: 0 3vw 40px 7vw; margin-top: 2vh; }
    .headline { font-size: clamp(44px, 4.9vw, 78px); max-width: 8.6em; }
    .search { margin-top: 34px; }
    .search input { font-size: 15px; }
    .credit { left: 7vw; bottom: 34px; }
    .rack-wrap { padding: 0 3vw 6vh 0; align-self: stretch; }

    .detail-view { display: grid; grid-template-columns: calc(var(--S) * 1.5) minmax(0, 1fr); --S: min(33vw, 56vh, 520px); align-items: start; }
    .d-left { position: sticky; top: 0; height: 100dvh; padding: 0; display: grid; align-items: center; }
    .cover-slot { --S: min(33vw, 56vh, 520px); margin: 0; }
    .d-right { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--header-h) + 8px) 6vw 56px 2vw; }
    .a-title { font-size: clamp(40px, 5vw, 76px); }
    .tracks li { font-size: 15px; padding: 12px 0; }
  }
  @media (max-width: 600px) {
    .topbar { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; }
    .brand { font-size: 20px; }
    .who { font-size: 13px; flex-direction: column; align-items: flex-start; gap: 3px; }
    .who .hi { max-width: 100%; }
    .pill { padding: 1px 8px; font-size: 11px; }
  }
  /* HP sangat kecil */
  @media (max-width: 380px) {
    .topbar { padding: 0 14px; }
    .brand { font-size: 22px; }
    .hero-view { padding-left: 16px; padding-right: 16px; }
    .credit { left: 16px; }
    .d-right { padding-left: 16px; padding-right: 16px; }
  }
  /* layar pendek (HP landscape) */
  @media (max-width: 899px) and (max-height: 520px) {
    .headline { font-size: 28px; }
    .search { margin-top: 14px; }
  }

  /* ---------- Popup login ---------- */
  .login-dialog { border: 0; padding: 0; margin: auto; background: transparent; width: min(400px, calc(100% - 40px)); max-width: none; overflow: visible; }

<script>
const $ = id => document.getElementById(id);
const SPOTIFY_RE = /open\.spotify\.com\/(intl-[a-z]{2}\/)?(album|playlist|track)\//;

/* =========================================================
   1. STATE MACHINE (halaman utama):  hero -> animating -> (pindah ke /album)
   Tahap 1 (album naik) dan Tahap 2 (hero slide ke kiri) berjalan di sini.
   Setelah itu posisi sampul diserahkan ke halaman album (Tahap 3) lewat sessionStorage.
   ========================================================= */
const page = $('page'), heroView = $('heroView');
const flyer = $('flyer'), vinyl = $('vinyl'), flyImg = $('flyImg');
const rack = $('rack'), flyLayer = $('flyLayer');
const input = $('urlInput'), form = $('searchForm'), hint = $('hint');
const ph = rack.querySelector('.flyer-slot');

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = ms => (REDUCED ? 1 : ms);
const wait = ms => new Promise(r => setTimeout(r, ms));

const MOTION = {
  lift:  { duration: 1700, easing: 'linear' },
  slide: { duration: 850, easing: 'cubic-bezier(.7, 0, .2, 1)' }
};
const HANDOFF_KEY = 'reloopa_handoff';

let state = 'hero';
let busy = false;

function setState(s) { state = s; page.dataset.state = s; }
function setHint(msg, kind) {
  hint.textContent = msg || '';
  hint.classList.toggle('err', kind === 'err');
  hint.classList.toggle('loading', kind === 'loading');
}
function run(el, keyframes, opts) {
  const o = { fill: 'forwards', ...opts };
  o.duration = T(o.duration); if (o.delay) o.delay = T(o.delay);
  return el.animate(keyframes, o);
}
function dockFlyerInRack() {
  rack.appendChild(flyer);
  flyer.getAnimations().forEach(a => a.cancel());
  flyer.removeAttribute('style');
  flyer.classList.remove('fixed', 'in-slot', 'spinning');
}
function loadImage(src) {
  return new Promise(res => { const i = new Image(); i.referrerPolicy = 'no-referrer'; i.onload = () => res(true); i.onerror = () => res(false); i.src = src; });
}

/* =========================================================
   GEOMETRI ANIMASI ANGKAT
   Titik sampul paling depan pada vinyl-rack.png (pecahan dari lebar/tinggi gambar 537×464)
   ========================================================= */
const FRONT = { top: [.7076, .2198], right: [.8305, .5819], left: [.5438, .5323] };

const lerp = (a, b, u) => a + (b - a) * u;
const easeInOut = u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const clamp01 = u => Math.min(1, Math.max(0, u));

function liftGeometry() {
  const rr = rack.getBoundingClientRect(), hr = ph.getBoundingClientRect();
  const hs = hr.width, W = rr.width;
  const pt = k => ({ x: rr.left + FRONT[k][0] * rr.width, y: rr.top + FRONT[k][1] * rr.height });
  const T = pt('top'), R = pt('right'), L = pt('left');

  /* POSE AWAL: kotak sampul dipetakan ke sampul depan rak (miring + pipih) */
  const a1 = { x: (R.x - T.x) / hs, y: (R.y - T.y) / hs };
  const a2 = { x: (L.x - T.x) / hs, y: (L.y - T.y) / hs };
  const n = Math.hypot(a1.x, a1.y);
  const p0 = {
    th: Math.atan2(a1.y, a1.x),
    sx: n,
    m: (a1.x * a2.x + a1.y * a2.y) / n,
    sy: (a1.x * a2.y - a1.y * a2.x) / n
  };
  const c0 = { x: (R.x + L.x) / 2, y: (R.y + L.y) / 2 };

  const vw = innerWidth, vh = innerHeight;
  const hdr = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 80;
  const wide = vw >= 900;
  const pose = (size, cx, cy, th = 0) => ({ th, sx: size / hs, m: 0, sy: size / hs, cx, cy });
  const belowHeader = (size, cy) => Math.max(cy, hdr + 12 + size / 2);   // jangan sampai menabrak header

  /* POSE 1 (Figma frame 1): keluar dari rak, tegak, kecil, di atas tumpukan, sedikit ke kiri */
  const s1 = W * .39;
  const p1 = pose(s1, rr.left + W * .403, belowHeader(s1, rr.top + W * .155), .012);

  /* POSE 2 (Figma frame 2): membesar, tepat di tengah rak */
  const S = wide ? Math.min(W * .61, vh * .56, 520) : Math.min(vw * .6, vh * .34, 340);
  const p2 = wide ? pose(S, rr.left + W * .5, belowHeader(S, rr.top + W * .369))
                  : pose(S, vw / 2, hdr + (vh - hdr) * .42);

  /* lintasan tahap 1: naik lurus dulu dari sampul depan, baru melengkung ke kiri */
  const cp = { x: c0.x, y: p1.cy };
  const bez = (a, b, c, e) => (1 - e) * (1 - e) * a + 2 * (1 - e) * e * b + e * e * c;

  const matrix = p => {
    const c = Math.cos(p.th), s = Math.sin(p.th);
    const a = c * p.sx, b = s * p.sx, cc = c * p.m - s * p.sy, d = s * p.m + c * p.sy;
    const ox = p.cx - (a + cc) * hs / 2, oy = p.cy - (b + d) * hs / 2;
    return `matrix(${a},${b},${cc},${d},${ox - hr.left},${oy - hr.top})`;
  };

  const T1 = .36, T2 = .46;      // 0–T1: keluar + berputar tegak | T1–T2: jeda singkat | T2–1: turun, membesar
  const at = t => {
    if (t <= T1) {
      const u = t / T1, e = 1 - Math.pow(1 - u, 3), r = easeInOut(u);
      return {
        th: lerp(p0.th, p1.th, r), sx: lerp(p0.sx, p1.sx, r),
        m:  lerp(p0.m,  p1.m,  r), sy: lerp(p0.sy, p1.sy, r),
        cx: bez(c0.x, cp.x, p1.cx, e), cy: bez(c0.y, cp.y, p1.cy, e)
      };
    }
    if (t <= T2) return p1;
    const u = easeInOut((t - T2) / (1 - T2));
    return {
      th: lerp(p1.th, p2.th, u), sx: lerp(p1.sx, p2.sx, u),
      m:  lerp(p1.m,  p2.m,  u), sy: lerp(p1.sy, p2.sy, u),
      cx: lerp(p1.cx, p2.cx, u), cy: lerp(p1.cy, p2.cy, u)
    };
  };

  const N = 72, frames = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    frames.push({ offset: t, transform: matrix(at(t)), opacity: Math.min(1, t / .05) });
  }
  return { frames, home: hr, endTransform: frames[N].transform };
}

function pinFlyerAt(rect) {                          // lepas dari rak -> fixed di atas semua
  flyer.classList.add('fixed');
  Object.assign(flyer.style, {
    left: rect.left + 'px', top: rect.top + 'px',
    width: rect.width + 'px', height: rect.height + 'px', transformOrigin: '0 0'
  });
  flyLayer.appendChild(flyer);
}


/* =========================================================
   2. SUBMIT -> TAHAP 1 + 2 -> pindah ke halaman album
   ========================================================= */
form.addEventListener('submit', e => { e.preventDefault(); submitLink(input.value.trim()); });

async function fetchAlbum(u) {
  let r;
  try { r = await fetch('/api/album-info?url=' + encodeURIComponent(u)); }
  catch { throw new Error('Tidak dapat terhubung ke server.'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || 'Gagal mengambil data album.');
  return d;
}

async function submitLink(v) {
  if (busy || state !== 'hero') return;
  if (!v) { input.focus(); return; }
  if (!SPOTIFY_RE.test(v)) {
    setHint('Link tidak valid. Contoh: https://open.spotify.com/album/...', 'err');
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    return;
  }
  busy = true;
  setState('animating');
  input.blur(); input.readOnly = true;
  setHint('mengambil data album...', 'loading');

  const dataP = fetchAlbum(v);                        // data diambil sekarang, dibawa ke halaman album
  dataP.catch(() => {});

  /* ---- TAHAP 1: sampul depan ditarik dari ujung rak, berputar naik, membesar ---- */
  const g = liftGeometry();
  pinFlyerAt(g.home);
  const lift = run(flyer, g.frames, { ...MOTION.lift, fill: 'both' });

  let data;
  try {
    await lift.finished;
    data = await dataP;                               // album melayang sampai data siap
    if (data.cover_url) {
      const ok = await Promise.race([loadImage(data.cover_url), wait(1800).then(() => false)]);
      if (ok) { flyImg.src = data.cover_url; flyImg.classList.add('ready'); }
    }
  } catch (err) {
    lift.reverse(); await lift.finished; lift.cancel();
    dockFlyerInRack();
    input.readOnly = false; setState('hero'); busy = false;
    setHint(err.message, 'err'); input.focus();
    return;
  }
  setHint('');
  const vt = 'CSSViewTransitionRule' in window;
  const r = flyer.getBoundingClientRect();            // pose akhir (tegak, besar)
  if (!vt) {   // fallback browser lama
    const hero = run(heroView, [{ transform: 'translateX(0)' }, { transform: 'translateX(-100%)' }], MOTION.slide);
    await hero.finished;
    page.classList.add('hero-gone');
  }

  /* ---- Serahkan ke halaman album (Tahap 3 berjalan di sana) ---- */
  try {
    sessionStorage.setItem(HANDOFF_KEY, JSON.stringify({
      dir: 'in', url: v, data, ts: Date.now(),
      rect: { l: r.left, t: r.top, w: r.width, h: r.height }
    }));
  } catch {}
  location.href = '/album?url=' + encodeURIComponent(v);
}

/* =========================================================
   3. KEMBALI DARI /album: hero slide masuk dari kiri, album turun ke rak
   ========================================================= */
async function arriveFromAlbum(h) {
  busy = true; setState('animating');
  input.value = h.url || ''; input.readOnly = true;
  if (h.data && h.data.cover_url) { flyImg.src = h.data.cover_url; flyImg.classList.add('ready'); }

  const g = liftGeometry();                           // hero belum bergeser -> rak di posisi akhirnya
  const r = h.rect;
  pinFlyerAt(g.home);
  const sc = r.w / g.home.width;
  const fromAlbum = `matrix(${sc},0,0,${sc},${r.l - g.home.left},${r.t - g.home.top})`;

  const hero = run(heroView, [{ transform: 'translateX(-100%)' }, { transform: 'translateX(0)' }], MOTION.slide);
  document.documentElement.classList.remove('pre-back');
  const back = run(flyer,
    [{ transform: fromAlbum, opacity: 1 }, { transform: g.endTransform, opacity: 1 }],
    { duration: MOTION.slide.duration + 100, easing: MOTION.slide.easing, fill: 'both' });
  await Promise.all([hero.finished, back.finished]);
  hero.cancel();

  /* pose besar -> berputar turun -> masuk ke ujung rak (animasi angkat diputar mundur) */
  const down = run(flyer, g.frames, { duration: 1200, easing: 'linear', direction: 'reverse', fill: 'both' });
  back.cancel();
  await down.finished;
  down.cancel();
  dockFlyerInRack();

  flyImg.classList.remove('ready'); flyImg.removeAttribute('src');
  input.readOnly = false; input.select();
  setState('hero'); busy = false;
  input.focus({ preventScroll: true });
}

// Tombol Back browser dari /album bisa mengembalikan halaman ini dari cache dalam kondisi setengah jalan -> muat ulang bersih
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

/* =========================================================
   5. MENU, LOGIN, KUOTA (logika asli, dipertahankan)
   ========================================================= */
const burger = $('burger'), menu = $('menu'), scrim = $('scrim');
function setMenu(open) {
  menu.classList.toggle('open', open);
  scrim.classList.toggle('open', open);
  burger.setAttribute('aria-expanded', open);
  burger.setAttribute('aria-label', open ? 'Tutup menu' : 'Buka menu');
}
burger.addEventListener('click', e => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); });
document.addEventListener('click', e => { if (!menu.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

const loginBtn = menu.querySelector('[data-action="login"]');
const logoutBtn = menu.querySelector('[data-action="logout"]');
const premiumBtn = $('premiumBtn'), menuUser = $('menuUser'), menuUserName = $('menuUserName'), menuCrown = $('menuCrown');
logoutBtn.hidden = true;

menu.addEventListener('click', async e => {
  const item = e.target.closest('[data-action]');
  if (!item) return;
  setMenu(false);
  const action = item.dataset.action;
  if (action === 'login') openLogin();
  if (action === 'premium') { if (currentUser) location.href = '/premium'; else openLogin(); }
  if (action === 'logout') { await fetch('/api/auth/logout', { method: 'POST' }); location.reload(); }
});
$('loginPill').addEventListener('click', openLogin);

function renderQuotaBadge(q) {
  const el = $('quotaBadge');
  if (!el) return;
  const n = q && typeof q.remaining === 'number' ? q.remaining : null;
  const unlimited = !!(q && q.unlimited) || (n !== null && n < 0);
  if (n === null && !unlimited) { el.hidden = true; return; }
  const empty = !unlimited && n === 0;
  el.querySelector('.qtext').textContent = unlimited ? 'Unlimited' : n.toLocaleString('id-ID') + ' Lagu';
  el.classList.toggle('is-empty', empty);
  el.title = empty ? 'Kuota unduhan habis' : unlimited ? 'Unduhan tanpa batas'
    : 'Sisa kuota unduhan' + (q && typeof q.limit === 'number' ? ' (dari ' + q.limit + ' lagu)' : '');
  el.hidden = false;
}
async function loadQuotaBadge() {
  try {
    const r = await fetch('/api/quota');
    if (!r.ok) return null;
    const q = await r.json();
    renderQuotaBadge(q);
    if (typeof applyCoverAccess === 'function') applyCoverAccess(q);
    const tier = $('tierPill');                      // pill "free" / "premium" di header
    const t = String(q.tier || q.type || q.plan || '').toLowerCase();
    if (t) { tier.textContent = t; tier.classList.toggle('is-premium', t !== 'free'); }
    return q;
  } catch { return null; }
}

let currentUser = null;
function setLoggedIn(user) {
  currentUser = user;
  const isPremium = !!(user && (user.is_premium || user.premium));
  loginBtn.hidden = !!user; menuUser.hidden = !user; menuCrown.hidden = !isPremium;
  premiumBtn.hidden = isPremium; logoutBtn.hidden = !user;
  $('loginPill').hidden = !!user;
  $('tierPill').hidden = !user;
  $('tierPill').textContent = isPremium ? 'premium' : 'free';
  $('tierPill').classList.toggle('is-premium', isPremium);
  const name = user ? (user.name || (user.email ? user.email.split('@')[0] : 'User')) : 'Tamu';
  $('uName').textContent = name;
  menuUserName.textContent = name;
  if (user) loadQuotaBadge(); else renderQuotaBadge(null);
}

const loginDialog = $('loginDialog'), loginErr = $('loginErr');
let gisLoading = false;
function openLogin() { loginErr.textContent = ''; loginDialog.showModal(); if (!gisLoading) loadGoogle(); }
function closeLogin() { loginDialog.close(); }
$('loginClose').addEventListener('click', closeLogin);
loginDialog.addEventListener('click', e => { if (e.target === loginDialog) closeLogin(); });

function takePendingDownload() {
  try {
    const raw = sessionStorage.getItem('pending_download');
    sessionStorage.removeItem('pending_download');
    const p = raw ? JSON.parse(raw) : null;
    return p && typeof p.returnTo === 'string' && /^\/(?!\/)/.test(p.returnTo) ? p : null;
  } catch { return null; }
}
function resumePendingDownload() { const p = takePendingDownload(); if (p) location.href = p.returnTo; }
loginDialog.addEventListener('close', () => { try { sessionStorage.removeItem('pending_download'); } catch {} });

function loadGoogle() {
  gisLoading = true;
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = initGoogle;
  s.onerror = () => { gisLoading = false; loginErr.textContent = 'Gagal memuat Login Google. Cek koneksi internet.'; };
  document.head.appendChild(s);
}
async function initGoogle() {
  try {
    const cfg = await (await fetch('/api/auth/config')).json();
    if (!cfg.google_client_id) { loginErr.textContent = 'GOOGLE_CLIENT_ID belum diatur di server.'; return; }
    google.accounts.id.initialize({ client_id: cfg.google_client_id, callback: handleCredential, ux_mode: 'popup' });
    google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: Math.min(280, loginDialog.clientWidth - 56) });
  } catch { loginErr.textContent = 'Gagal menyiapkan Login Google.'; }
}
async function handleCredential(resp) {
  loginErr.textContent = '';
  try {
    const r = await fetch('/api/auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) });
    if (!r.ok) throw new Error((await r.json()).detail || 'Login gagal.');
    const pending = takePendingDownload();
    closeLogin();
    setLoggedIn(await r.json());
    if (pending) location.href = pending.returnTo;
  } catch (e) { loginErr.textContent = e.message; }
}

/* =========================================================
   INIT
   ========================================================= */
fetch('/api/auth/me')
  .then(r => (r.ok ? r.json() : null))
  .then(u => {
    setLoggedIn(u);
    if (u) resumePendingDownload();
    else if (new URLSearchParams(location.search).get('login') === '1') openLogin();
  })
  .catch(() => setLoggedIn(null));

(function boot() {
  let h = null;
  try { h = JSON.parse(sessionStorage.getItem(HANDOFF_KEY) || 'null'); sessionStorage.removeItem(HANDOFF_KEY); } catch {}
  const back = new URLSearchParams(location.search).get('back') === '1';
  if (back) { try { history.replaceState(null, '', location.pathname); } catch {} }
  if (back && h && h.dir === 'back' && h.rect && Date.now() - h.ts < 30000) arriveFromAlbum(h);
  else document.documentElement.classList.remove('pre-back');
})();
