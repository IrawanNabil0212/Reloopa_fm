<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembayaran - Transfer Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Gilda+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f0f12; --muted: #6f7178; --gold: #e39a12; --row: #f3f4f7;
    --display: "Gilda Display", "Cabin", serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    --header-h: 76px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  html { overscroll-behavior-y: none; }
  body { font-family: var(--body); color: var(--ink); background: #fff; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .bg {
    position: fixed; top: 0; bottom: 0; left: 0; width: 72%;
    z-index: 0; pointer-events: none; opacity: .6;
    background:
      url("/static/img/wash.jpg") center / cover no-repeat,
      radial-gradient(60% 50% at 15% 15%, rgba(255, 170, 205, .55), transparent 70%),
      radial-gradient(60% 50% at 85% 25%, rgba(150, 195, 255, .55), transparent 70%),
      radial-gradient(60% 50% at 55% 85%, rgba(255, 233, 150, .5), transparent 70%);
    filter: blur(2px) saturate(1.08);
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 30%, rgba(0,0,0,.55) 58%, rgba(0,0,0,.18) 80%, transparent 100%);
            mask-image: linear-gradient(90deg, #000 0%, #000 30%, rgba(0,0,0,.55) 58%, rgba(0,0,0,.18) 80%, transparent 100%);
  }
  .page { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }

  /* ---------- Header ---------- */
  .topbar {
    position: relative; z-index: 30; height: var(--header-h);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 20px; gap: 12px;
  }
  .brand { font-family: var(--display); font-size: 26px; letter-spacing: .01em; text-align: center; white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; font-family: var(--display); font-size: 15px; }
  .who .hi { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pill {
    flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none;
    font-family: var(--mono); font-size: 15px; font-weight: 500; color: #55565d;
  }
  .pill.is-premium { color: #8a5a00; }
  .burger {
    position: relative; z-index: 3; justify-self: end; width: 40px; height: 40px;
    display: grid; place-items: center; background: none; border: 0; border-radius: 10px; cursor: pointer;
  }
  .burger:hover { background: rgba(255, 255, 255, .6); }
  .burger:focus-visible, .menu-item:focus-visible, .copy:focus-visible, .pay:focus-visible,
  .link-btn:focus-visible, .bank:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
  .burger svg line { transition: transform .25s ease, opacity .2s ease; transform-origin: center; }
  .burger[aria-expanded="true"] .l1 { transform: translateY(6px) rotate(45deg); }
  .burger[aria-expanded="true"] .l2 { opacity: 0; }
  .burger[aria-expanded="true"] .l3 { transform: translateY(-6px) rotate(-45deg); }

  /* ---------- Menu ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 31; background: rgba(8, 8, 12, .6);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s .25s;
  }
  .scrim.open { opacity: 1; visibility: visible; transition: opacity .25s ease; }
  .menu {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 32;
    width: clamp(220px, 60vw, 300px); padding: 24px 12px 24px 14px;
    background: #fff; border-radius: 26px 0 0 26px; box-shadow: -12px 0 40px rgba(0, 0, 0, .18);
    display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
    transform: translateX(100%); visibility: hidden;
    transition: transform .28s var(--ease-out), visibility 0s .28s;
  }
  .menu.open { transform: none; visibility: visible; transition: transform .28s var(--ease-out); }
  .menu-title { font-size: 20px; font-weight: 500; line-height: 28px; padding-left: 8px; margin-bottom: 14px; }
  .menu-item {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 8px;
    background: none; border: 0; border-radius: 10px; font-size: 15px; font-weight: 500;
    text-align: left; cursor: pointer; transition: background .15s ease;
  }
  button.menu-item:hover { background: #f3f4f7; }
  .menu-item.is-static { cursor: default; }
  .menu-item > svg { flex: none; }
  .menu-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-item .chev { color: var(--muted); }
  .menu-crown { color: var(--gold); }

  /* ---------- Konten ---------- */
  .wrap {
    position: relative; z-index: 1; flex: 1; width: 100%; max-width: 760px; margin: 0 auto;
    padding: 24px 22px 0; display: flex; flex-direction: column; gap: 40px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
  }
  .eyebrow svg { color: var(--gold); }
  .headline {
    margin-top: 12px; font-family: var(--display); font-weight: 400; text-transform: lowercase;
    font-size: clamp(40px, 11vw, 56px); line-height: 1.08; letter-spacing: -.01em; max-width: 11em;
  }
  .layout { flex: 1; display: flex; flex-direction: column; gap: 32px; }
  .picks > .label { margin: 0 0 20px; font-family: var(--display); font-size: 26px; font-weight: 400; }
  .banks { display: flex; flex-direction: column; gap: 14px; }

  .bank {
    position: relative; display: flex; align-items: center; gap: 16px; padding: 18px 20px;
    background: rgba(255, 255, 255, .82);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(15, 15, 18, .18); border-radius: 24px;
    box-shadow: 0 16px 40px rgba(30, 10, 50, .10); cursor: pointer;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .bank:hover { background: #fff; border-color: rgba(15, 15, 18, .45); transform: translateY(-1px); }
  .bank:has(input:checked) { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), 0 16px 40px rgba(30, 10, 50, .10); }
  .bank input { position: absolute; opacity: 0; pointer-events: none; }
  .bank.is-static { cursor: default; }
  .bank.is-static:hover { background: rgba(255, 255, 255, .82); border-color: rgba(15, 15, 18, .18); transform: none; }

  .logo { width: 56px; height: 36px; flex: none; display: grid; place-items: center; }
  .logo img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .info { flex: 1; min-width: 0; }
  .info strong { display: block; font-size: 15px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }

  .radio { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; }
  .radio::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transform: scale(0); transition: transform .15s ease; }
  .bank:has(input:checked) .radio::after { transform: scale(1); }

  /* instruksi pembayaran */
  .codes {
    margin-top: 14px; padding: 8px 20px 20px;
    background: rgba(255, 255, 255, .82);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(15, 15, 18, .18); border-radius: 24px; box-shadow: 0 16px 40px rgba(30, 10, 50, .10);
  }
  .code-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; border-bottom: 1px solid rgba(15, 15, 18, .12); }
  .code-row:last-of-type { border-bottom: 0; }
  .code-label { display: block; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .code-val { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; letter-spacing: .03em; overflow-wrap: anywhere; }
  .copy {
    display: grid; place-items: center; width: 38px; height: 38px; flex: none; padding: 0; cursor: pointer;
    border-radius: 50%; background: rgba(255, 255, 255, .7); border: 1px solid rgba(15, 15, 18, .25); color: var(--ink);
  }
  .copy:hover { background: #fff; }
  .meta { margin-top: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .status { margin-top: 10px; font-family: var(--mono); font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
  .status.ok { color: #1a8f4c; } .status.ok::before { background: #1a8f4c; animation: none; }
  .status.bad { color: #c0392b; } .status.bad::before { background: #c0392b; animation: none; }
  .link-btn { margin-top: 14px; padding: 0; border: 0; background: none; font-family: var(--mono); font-size: 12.5px; font-weight: 500; text-decoration: underline; cursor: pointer; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* total & tombol bayar (di bawah daftar, tidak menempel) */
  .summary {
    position: static; margin-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    padding: 20px 22px; background: rgba(255, 255, 255, .85);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(15, 15, 18, .18); border-radius: 24px; box-shadow: 0 16px 40px rgba(30, 10, 50, .10);
  }
  .total { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .total span:first-child { font-family: var(--mono); font-size: 12px; color: #55565d; }
  .total span:last-child { font-family: var(--display); font-size: 34px; font-weight: 400; }
  .pay {
    display: block; width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 999px;
    background: var(--ink); color: #fff; font-family: var(--mono); font-size: 14px; font-weight: 500; cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  .pay:active { transform: scale(.99); }
  .pay[aria-disabled="true"] { opacity: .35; cursor: not-allowed; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px); z-index: 50;
    max-width: calc(100% - 40px); text-align: center; background: var(--ink); color: #fff;
    font-family: var(--mono); font-size: 12.5px; padding: 10px 16px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (hover: none) { .bank:hover { background: rgba(255, 255, 255, .82); border-color: rgba(15, 15, 18, .18); transform: none; } }

  @media (min-width: 600px) {
    .banks { gap: 18px; }
    .summary { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .total { gap: 20px; }
    .summary .pay { width: auto; margin-top: 0; padding: 16px 40px; flex: none; }
  }
  @media (min-width: 900px) {
    :root { --header-h: 84px; }
    .topbar { padding: 0 6.5vw 0 7.8vw; }
    .brand { font-size: 32px; }
    .who { font-size: 16px; gap: 12px; }
    .menu { padding-top: 32px; }
    .wrap { max-width: 900px; padding: 48px 28px 0; gap: 48px; }
    .layout { gap: 40px; }
    .headline { font-size: clamp(48px, 5.4vw, 80px); line-height: 1.06; max-width: 12em; margin-top: 16px; }
    .picks > .label { margin-bottom: 28px; }
    .bank { padding: 20px 24px; gap: 20px; }
    .logo { width: 64px; height: 40px; }
    .info strong { font-size: 16px; }
  }
  @media (max-width: 600px) {
    .topbar { gap: 6px; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
    .brand { font-size: 20px; }
    .who { font-size: 13px; flex-direction: column; align-items: flex-start; gap: 3px; }
    .pill { font-size: 12px; }
  }
  @media (max-width: 380px) {
    .topbar { padding: 0 14px; } .brand { font-size: 22px; }
    .wrap { padding-left: 16px; padding-right: 16px; }
    .bank { padding: 14px; gap: 10px; } .logo { width: 46px; }
    .code-val { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .menu, .scrim, .burger svg line, .toast, .bank, .radio::after, .pay { transition: none; }
    .status::before { animation: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="page">

  <header class="topbar">
    <div class="who">
      <span class="hi">Hai, <span id="welcome">Tamu</span></span>
      <span class="pill" id="tierPill" hidden>free</span>
    </div>
    <div class="brand">Reloopa.fm</div>
    <button class="burger" id="burger" aria-label="Buka menu" aria-expanded="false" aria-controls="menu">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <line class="l1" x1="3" y1="7" x2="23" y2="7"/><line class="l2" x1="3" y1="13" x2="23" y2="13"/><line class="l3" x1="3" y1="19" x2="23" y2="19"/>
      </svg>
    </button>
  </header>

  <div class="scrim" id="scrim"></div>
  <nav class="menu" id="menu" aria-label="Menu akun">
    <div class="menu-title">Menu</div>

    <div class="menu-item is-static" id="menuUser" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg>
      <span class="label" id="menuUserName"></span>
      <svg class="menu-crown" id="menuCrown" hidden width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/><path d="M5.5 22h13"/></svg>
    </div>

    <button class="menu-item" data-action="back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="label">Metode pembayaran</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="menu-item" data-action="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span class="label">Beranda</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="menu-item" data-action="logout">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/></svg>
      <span class="label">Logout</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </nav>

  <div class="wrap">
    <section class="intro">
      <span class="eyebrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/><path d="M5.5 22h13"/></svg>Transfer Bank</span>
      <h1 class="headline">pilih bank untuk membayar</h1>
    </section>

    <main class="layout">
      <section class="picks">
        <p class="label" id="pick-label">Pilih Pembayaran :</p>
        <div class="banks" id="banks" role="radiogroup" aria-labelledby="pick-label"></div>
      </section>

      <aside class="summary">
        <div class="total"><span>Total :</span><span id="total">Rp100.000</span></div>
        <button class="pay" id="pay" aria-disabled="true">Bayar Sekarang</button>
      </aside>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $ = id => document.getElementById(id);
const SUCCESS_URL = '/';              // tujuan setelah pembayaran berhasil (ubah sesuai kebutuhan)
const POLL_MS = 4000;

const params = new URLSearchParams(location.search);
const PRODUCT = ['premium', 'pass'].includes(params.get('product')) ? params.get('product') : 'premium';
let orderId = params.get('order');

const rupiah = n => 'Rp' + Number(n).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---- Cek login ----
fetch('/api/auth/me')
  .then(r => { if (!r.ok) throw new Error('belum login'); return r.json(); })
  .then(u => {
    const name = u.name || (u.email ? u.email.split('@')[0] : 'User');
    const isPremium = !!(u.is_premium || u.premium);
    $('menuUser').hidden = false;
    $('menuUserName').textContent = name;
    $('menuCrown').hidden = !isPremium;
    $('welcome').textContent = name;
    $('tierPill').textContent = isPremium ? 'premium' : 'free';
    $('tierPill').classList.toggle('is-premium', isPremium);
    $('tierPill').hidden = false;
  })
  .catch(() => location.replace('/'));

// ---- Helper API ----
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.replace('/'); throw new Error('Belum login.'); }
  let data = {};
  try { data = await r.json(); } catch { /* body kosong */ }
  if (!r.ok) throw new Error(data.detail || 'Terjadi kesalahan. Coba lagi.');
  return data;
}

// ---- Data bank (tanpa nomor VA dummy) ----
const BANKS = [
  { id: 'bca',     name: 'BCA Virtual Account',         logo: '/static/img/bca.svg' },
  { id: 'mandiri', name: 'Mandiri Virtual Account',     logo: '/static/img/mandiri.png' },
  { id: 'bri',     name: 'BRI Virtual Account (BRIVA)', logo: '/static/img/bri.png' },
  { id: 'bni',     name: 'BNI Virtual Account',         logo: '/static/img/bni.png' },
];
const bankById = id => BANKS.find(b => b.id === id);

const COPY_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';

// ---- Toast ----
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ---- Harga: sumber utama dari server, cadangan dari ?harga= ----
function setTotal(n) { if (Number.isFinite(Number(n)) && Number(n) > 0) $('total').textContent = rupiah(n); }
const priceFromUrl = Number(params.get('harga'));
if (Number.isInteger(priceFromUrl) && priceFromUrl > 0) setTotal(priceFromUrl);
fetch('/api/payments/products')
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(p => { if (!orderId && p[PRODUCT]) setTotal(p[PRODUCT].price); })
  .catch(() => {});

// ---- Mode UI ----
let mode = 'select';   // 'select' | 'check' | 'restart'
const pay = $('pay');
function setPayButton(text, enabled, newMode) {
  pay.textContent = text;
  pay.setAttribute('aria-disabled', enabled ? 'false' : 'true');
  if (newMode) mode = newMode;
}

// ---- Tampilan 1: pilih bank ----
function renderSelect() {
  stopPolling(); stopCountdown();
  $('pick-label').textContent = 'Pilih Pembayaran :';
  $('banks').setAttribute('role', 'radiogroup');
  $('banks').innerHTML = BANKS.map(b => `
    <label class="bank">
      <input type="radio" name="bank" value="${b.id}">
      <span class="logo"><img src="${b.logo}" alt="${esc(b.name.split(' ')[0])}"></span>
      <span class="info"><strong>${esc(b.name)}</strong></span>
      <span class="radio" aria-hidden="true"></span>
    </label>`).join('');
  setPayButton('Bayar Sekarang', false, 'select');
}
$('banks').addEventListener('change', () => { if (mode === 'select') setPayButton('Bayar Sekarang', true); });

// ---- Tampilan 2: instruksi pembayaran ----
let expiresAt = null, countdownTimer = null;

function codeRow(label, value) {
  return `
    <div class="code-row">
      <div><span class="code-label">${esc(label)}</span><strong class="code-val">${esc(value)}</strong></div>
      <button type="button" class="copy" data-copy="${esc(value)}" aria-label="Salin ${esc(label)}">${COPY_ICON}</button>
    </div>`;
}

function renderInstructions(d) {
  const bank = bankById(d.bank) || { name: String(d.bank || 'Bank').toUpperCase(), logo: '' };
  const rows = d.bill_key
    ? codeRow('Kode Perusahaan', d.biller_code) + codeRow('Kode Pembayaran', d.bill_key)
    : codeRow('Nomor Virtual Account', d.va_number);

  $('pick-label').textContent = 'Selesaikan Pembayaran :';
  $('banks').removeAttribute('role');
  $('banks').innerHTML = `
    <div class="bank is-static">
      <span class="logo">${bank.logo ? `<img src="${bank.logo}" alt="">` : ''}</span>
      <span class="info"><strong>${esc(bank.name)}</strong></span>
    </div>
    <div class="codes">
      ${rows}
      <p class="meta" id="metaExpiry" hidden>Bayar sebelum <b id="countdown">--:--</b></p>
      <p class="status" id="status">Menunggu pembayaran…</p>
      <button type="button" class="link-btn" id="changeBank">Ganti bank</button>
      ${d.sandbox ? '<p class="meta">Mode sandbox: simulasikan pembayaran lewat simulator Midtrans.</p>' : ''}
    </div>`;

  setTotal(d.amount);
  $('changeBank').addEventListener('click', restart);
  setPayButton('Cek Status Pembayaran', true, 'check');

  expiresAt = d.expires_at || null;
  if (expiresAt) { $('metaExpiry').hidden = false; startCountdown(); }
}

function setStatus(text, cls) {
  const s = $('status');
  if (!s) return;
  s.textContent = text;
  s.className = 'status' + (cls ? ' ' + cls : '');
}

// ---- Countdown ----
function fmt(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function tick() {
  const el = $('countdown');
  if (!el || !expiresAt) return;
  const left = Math.floor(expiresAt - Date.now() / 1000);
  if (left <= 0) { el.textContent = '00:00'; stopCountdown(); pollOnce(false); return; }  // status akhir tetap dari Midtrans
  el.textContent = fmt(left);
}
function startCountdown() { stopCountdown(); tick(); countdownTimer = setInterval(tick, 1000); }
function stopCountdown() { clearInterval(countdownTimer); countdownTimer = null; }

// ---- Polling status ----
let pollTimer = null, polling = false, finished = false;

async function pollOnce(manual) {
  if (polling || finished || !orderId) return;
  polling = true;
  try {
    const s = await api(`/api/payments/status/${encodeURIComponent(orderId)}`);
    if (s.status === 'paid') return onPaid();
    if (s.status === 'expired' || s.status === 'failed') return onDead(s.status);
    if (manual) toast('Pembayaran belum diterima.');
  } catch (e) {
    if (manual) toast(e.message);
  } finally {
    polling = false;
  }
}
function startPolling() { stopPolling(); finished = false; pollTimer = setInterval(() => pollOnce(false), POLL_MS); }
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }

function onPaid() {
  finished = true; stopPolling(); stopCountdown();
  setStatus('Pembayaran berhasil! Mengalihkan…', 'ok');
  setPayButton('Pembayaran Berhasil', false);
  setTimeout(() => location.replace(SUCCESS_URL), 1500);
}
function onDead(status) {
  finished = true; stopPolling(); stopCountdown();
  setStatus(status === 'expired' ? 'Pembayaran kedaluwarsa.' : 'Pembayaran dibatalkan / gagal.', 'bad');
  setPayButton('Pilih Pembayaran Lagi', true, 'restart');
}

// ---- Kembali ke pilih bank (hapus ?order dari URL) ----
function restart() {
  finished = true; stopPolling(); stopCountdown();
  orderId = null;
  params.delete('order');
  history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
  renderSelect();
}

// ---- Muat ulang instruksi dari order yang sudah ada (?order=...) ----
async function loadExisting() {
  try {
    const d = await api(`/api/payments/instructions/${encodeURIComponent(orderId)}`);
    if (d.product && d.product !== PRODUCT) params.set('product', d.product);
    renderInstructions(d);
    if (d.status === 'paid') return onPaid();
    if (d.status === 'expired' || d.status === 'failed') return onDead(d.status);
    startPolling();
    pollOnce(false);   // cek segera: status lokal bisa tertinggal dari Midtrans
  } catch (e) {
    toast(e.message);
    restart();
  }
}

// ---- Klik tombol utama ----
let busy = false;
pay.addEventListener('click', async () => {
  if (busy) return;

  if (mode === 'check') return pollOnce(true);
  if (mode === 'restart') return restart();

  const chosen = document.querySelector('input[name="bank"]:checked');
  if (!chosen) return toast('Pilih bank terlebih dahulu');

  busy = true;
  setPayButton('Memproses…', false);
  try {
    const d = await api(
      `/api/payments/bank-transfer?bank=${encodeURIComponent(chosen.value)}&product=${encodeURIComponent(PRODUCT)}`,
      { method: 'POST' }
    );
    orderId = d.order_id;
    params.set('order', orderId);
    params.set('product', PRODUCT);
    history.replaceState(null, '', location.pathname + '?' + params);   // aman saat di-refresh
    renderInstructions(d);
    startPolling();
  } catch (e) {
    toast(e.message);
    setPayButton('Bayar Sekarang', true, 'select');
  } finally {
    busy = false;
  }
});

// ---- Salin nomor ----
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (!ok) throw new Error('copy gagal');
  }
}
$('banks').addEventListener('click', async e => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  e.preventDefault();
  try { await copyText(btn.dataset.copy); toast('Berhasil disalin'); }
  catch { toast('Gagal menyalin, salin manual'); }
});

// Cek langsung saat tab kembali aktif (browser menunda timer di tab latar)
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollOnce(false); });

// ---- Menu hamburger (tidak berubah) ----
const burger = $('burger'), menu = $('menu'), scrim = $('scrim');
function setMenu(open) {
  menu.classList.toggle('open', open);
  scrim.classList.toggle('open', open);
  burger.setAttribute('aria-expanded', open);
  burger.setAttribute('aria-label', open ? 'Tutup menu' : 'Buka menu');
}
burger.addEventListener('click', e => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); });
document.addEventListener('click', e => { if (!menu.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
menu.addEventListener('click', async e => {
  const item = e.target.closest('[data-action]');
  if (!item) return;
  setMenu(false);
  const a = item.dataset.action;
  if (a === 'back') location.href = '/premium';
  if (a === 'home') location.href = '/';
  if (a === 'logout') {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/';
  }
});

// ---- Mulai ----
if (orderId) {
  $('pick-label').textContent = 'Memuat pembayaran…';
  $('banks').innerHTML = '';
  setPayButton('Cek Status Pembayaran', false, 'check');
  loadExisting();
} else {
  renderSelect();
}
</script>

</body>
</html>
