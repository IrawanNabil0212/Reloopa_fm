<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #0f0f12; background: #f3f4f7;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 960px; margin: 0 auto; padding: 18px 20px;
  }
  .title { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #fff;
    display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .back {
    text-decoration: none; color: #0f0f12; font-size: 14px; font-weight: 600;
    padding: 10px 14px; border-radius: 10px;
  }
  .back:hover { background: #e7e9ee; }
  main { flex: 1; display: grid; place-items: center; padding: 16px 20px 48px; }
  .card {
    width: 100%; max-width: 400px; background: #fff; border-radius: 24px;
    padding: 32px 28px; text-align: center;
    box-shadow: 0 18px 50px rgba(20, 20, 40, .12);
  }
  .logo { font-size: 28px; letter-spacing: .02em; margin-bottom: 22px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  p { color: #6f7178; font-size: 14px; line-height: 1.5; margin-bottom: 26px; }
  #gbtn { display: flex; justify-content: center; min-height: 44px; }
  .err { margin-top: 18px; color: #b3261e; font-size: 13px; min-height: 1.2em; }
    .menu-item[hidden] { display: none; }
</style>
</head>
<body>
  <header class="top">
    <div class="title">
      <span class="avatar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg>
      </span>
      Login
    </div>
    <a class="back" href="/">Beranda</a>
  </header>

  <main>
    <section class="card">
      <div class="logo">LOGO</div>
      <h1>Login dengan Google</h1>
      <p>Masuk memakai akun Google kamu untuk mulai mengunduh album.</p>
      <div id="gbtn"></div>
      <div class="err" id="err" role="alert"></div>
    </section>
  </main>

<script>
const errEl = document.getElementById('err');

// Sudah login? langsung ke beranda
fetch('/api/auth/me').then(r => { if (r.ok) location.replace('/'); }).catch(() => {});

// Dipanggil Google setelah user memilih akun
async function handleCredential(resp) {
  errEl.textContent = '';
  try {
    const r = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: resp.credential })
    });
    if (!r.ok) throw new Error((await r.json()).detail || 'Login gagal.');
    location.href = '/';
  } catch (e) {
    errEl.textContent = e.message;
  }
}

// Dipanggil setelah library Google selesai dimuat
async function initGoogle() {
  try {
    const cfg = await (await fetch('/api/auth/config')).json();
    if (!cfg.google_client_id) {
      errEl.textContent = 'GOOGLE_CLIENT_ID belum diatur di server.';
      return;
    }
    google.accounts.id.initialize({
      client_id: cfg.google_client_id,
      callback: handleCredential,
      ux_mode: 'popup'
    });
    google.accounts.id.renderButton(document.getElementById('gbtn'), {
      theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 280
    });
  } catch {
    errEl.textContent = 'Gagal memuat Login Google. Cek koneksi internet.';
  }
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
</body>
</html>
